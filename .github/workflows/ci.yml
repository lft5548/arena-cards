name: arena-cards-ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux test environment
        run: docker build -f deploy/Dockerfile.sanitizers -t arena-cards-sanitizers deploy
      - name: ASan and UBSan CTest
        run: >-
          docker run --rm
          --mount "type=bind,source=$PWD,target=/workspace"
          arena-cards-sanitizers --parallel 2
      - name: Prepare sanitizer evidence
        if: always()
        shell: bash
        run: |
          mkdir -p ci-artifacts/sanitizers

          # Containers may create sanitizer reports readable only by root.
          # Copy diagnostic text, excluding probe binaries, before uploading.
          if [ -d build-sanitizers/sanitizer-runs ]; then
            sudo find build-sanitizers/sanitizer-runs -type f \
              \( -name summary.json -o -name ctest.xml -o -name '*.log' \
                 -o -name 'asan.*' -o -name 'ubsan.*' \) \
              -exec cp --parents {} ci-artifacts/sanitizers/ \;
          fi

          for source in \
            build-sanitizers/compile_commands.json \
            build-sanitizers/Testing/Temporary/LastTestsFailed.log; do
            if [ -f "$source" ]; then
              sudo cp "$source" ci-artifacts/sanitizers/
            fi
          done

          sudo chown -R "$(id -u):$(id -g)" ci-artifacts/sanitizers
          chmod -R u+rwX ci-artifacts/sanitizers

      - name: Preserve sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-sanitizers
          path: ci-artifacts/sanitizers/
          if-no-files-found: warn
          compression-level: 0
